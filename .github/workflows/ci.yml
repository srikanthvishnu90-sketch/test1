name: Sporve CI

# The Flutter project lives in the SportsMan-main/ subtree of this repo, so the
# workflow lives at the repo root (GitHub only runs workflows from the root) and
# every step operates inside SportsMan-main/. Scoped to changes in that subtree.
on:
  push:
    paths:
      - 'SportsMan-main/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'SportsMan-main/**'
      - '.github/workflows/ci.yml'

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: sporve-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: SportsMan-main

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      # Public client config is gitignored; tests/analyze run on the mock repo
      # and only need placeholder values (String.fromEnvironment defaults).
      - name: Provide placeholder env.json
        run: cp env.example.json env.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Non-blocking: surfaces unformatted files without failing the build while
      # the back-catalogue is brought up to `dart format` standard.
      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
